<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 IoT Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050d1a;
    --panel: #0a1628;
    --border: #0f3460;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #00ff9d;
    --text: #c8e6ff;
    --muted: #3a6080;
    --danger: #ff3a5c;
    --warm: #ffaa00;
    --grid: rgba(0, 212, 255, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(0,255,157,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header-left h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
  }

  .header-left p {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
  }

  .connection-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.4s;
  }
  .dot.connected { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); animation: pulse 2s infinite; }
  .dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .dot.connecting { background: var(--warm); box-shadow: 0 0 8px var(--warm); animation: blink 0.8s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* SETTINGS PANEL */
  .settings-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    align-items: end;
    position: relative;
    overflow: hidden;
  }

  .settings-panel::before {
    content: 'MQTT CONFIG';
    position: absolute;
    top: 12px; right: 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .field label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 6px;
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    background: rgba(0,212,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.12);
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
  }
  .btn-primary:hover { background: #00b8d9; box-shadow: 0 0 16px rgba(0,212,255,0.4); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .btn-danger:hover { background: rgba(255,58,92,0.1); }

  /* METRICS GRID */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  .metric-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .metric-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .metric-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .metric-card.temp::after { background: linear-gradient(90deg, var(--accent2), transparent); }
  .metric-card.hum::after  { background: linear-gradient(90deg, var(--accent), transparent); }
  .metric-card.lamp::after { background: linear-gradient(90deg, var(--accent3), transparent); }

  .metric-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .metric-label .icon { font-size: 14px; }

  .metric-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 52px;
    font-weight: 400;
    line-height: 1;
    margin-bottom: 6px;
  }

  .temp .metric-value { color: var(--accent2); text-shadow: 0 0 24px rgba(255,107,53,0.4); }
  .hum  .metric-value { color: var(--accent);  text-shadow: 0 0 24px rgba(0,212,255,0.4); }

  .metric-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    color: var(--muted);
    margin-left: 4px;
  }

  .metric-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* GAUGE BAR */
  .gauge-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    margin-top: 16px;
    overflow: hidden;
  }

  .gauge-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }

  .temp .gauge-fill { background: linear-gradient(90deg, #ff6b35, #ffaa00); }
  .hum  .gauge-fill { background: linear-gradient(90deg, #0057ff, #00d4ff); }

  /* LAMP CONTROL */
  .lamp-status {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 16px 0;
  }

  .lamp-icon {
    font-size: 40px;
    transition: all 0.4s;
    filter: grayscale(1) opacity(0.3);
  }

  .lamp-icon.on {
    filter: grayscale(0) drop-shadow(0 0 12px #ffaa00);
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { filter: grayscale(0) drop-shadow(0 0 8px #ffaa00); }
    to   { filter: grayscale(0) drop-shadow(0 0 20px #ffaa00); }
  }

  .lamp-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    color: var(--muted);
    transition: color 0.3s;
  }
  .lamp-text.on { color: var(--accent3); }

  .toggle-switch {
    position: relative;
    width: 72px; height: 36px;
    margin-top: 12px;
    cursor: pointer;
  }

  .toggle-switch input { display: none; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 36px;
    transition: all 0.3s;
  }

  .toggle-switch input:checked + .toggle-track {
    background: rgba(0,255,157,0.15);
    border-color: var(--accent3);
    box-shadow: 0 0 12px rgba(0,255,157,0.3);
  }

  .toggle-thumb {
    position: absolute;
    top: 4px; left: 4px;
    width: 26px; height: 26px;
    background: var(--muted);
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  .toggle-switch input:checked ~ .toggle-thumb {
    transform: translateX(36px);
    background: var(--accent3);
    box-shadow: 0 0 8px var(--accent3);
  }

  .lamp-toggle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
  }

  /* HISTORY CHART */
  .history-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .section-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 20px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  canvas#chart {
    width: 100% !important;
    height: 180px !important;
  }

  /* LOG PANEL */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .log-entries {
    max-height: 160px;
    overflow-y: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .log-entries::-webkit-scrollbar { width: 4px; }
  .log-entries::-webkit-scrollbar-track { background: transparent; }
  .log-entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .log-entry {
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

  .log-entry .ts { color: var(--accent); margin-right: 8px; }
  .log-entry.info .msg { color: var(--text); }
  .log-entry.ok   .msg { color: var(--accent3); }
  .log-entry.warn .msg { color: var(--warm); }
  .log-entry.err  .msg { color: var(--danger); }

  /* Timestamp */
  .last-update {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    margin-top: 8px;
  }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    z-index: 100;
  }

  @media (max-width: 600px) {
    .metric-value { font-size: 38px; }
    header { flex-direction: column; gap: 12px; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <h1>⚡ ESP32 IoT Dashboard</h1>
      <p>// MQTT REALTIME MONITORING SYSTEM</p>
    </div>
    <div class="connection-badge">
      <div class="dot" id="connDot"></div>
      <span id="connLabel" style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted)">DISCONNECTED</span>
    </div>
  </header>

  <!-- SETTINGS -->
  <div class="settings-panel">
    <div class="field">
      <label>Broker Host</label>
      <input type="text" id="broker" value="broker.hivemq.com" placeholder="broker.hivemq.com">
    </div>
    <div class="field">
      <label>WebSocket Port</label>
      <input type="number" id="port" value="8884" placeholder="8884">
    </div>
    <div class="field">
      <label>Topic Suhu</label>
      <input type="text" id="topicTemp" value="esp32/suhu" placeholder="esp32/suhu">
    </div>
    <div class="field">
      <label>Topic Kelembaban</label>
      <input type="text" id="topicHum" value="esp32/kelembaban" placeholder="esp32/kelembaban">
    </div>
    <div class="field">
      <label>Topic Lampu</label>
      <input type="text" id="topicLamp" value="esp32/lampu" placeholder="esp32/lampu">
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <button class="btn btn-primary" onclick="connectMQTT()">CONNECT</button>
      <button class="btn btn-danger" onclick="disconnectMQTT()">DISC</button>
    </div>
  </div>

  <!-- METRICS -->
  <div class="metrics-grid">
    <!-- Suhu -->
    <div class="metric-card temp">
      <div class="metric-label"><span class="icon">🌡️</span> SUHU</div>
      <div>
        <span class="metric-value" id="tempVal">--</span>
        <span class="metric-unit">°C</span>
      </div>
      <div class="metric-sub" id="tempStatus">Menunggu data...</div>
      <div class="gauge-bar"><div class="gauge-fill" id="tempGauge" style="width:0%"></div></div>
    </div>

    <!-- Kelembaban -->
    <div class="metric-card hum">
      <div class="metric-label"><span class="icon">💧</span> KELEMBABAN</div>
      <div>
        <span class="metric-value" id="humVal">--</span>
        <span class="metric-unit">%</span>
      </div>
      <div class="metric-sub" id="humStatus">Menunggu data...</div>
      <div class="gauge-bar"><div class="gauge-fill" id="humGauge" style="width:0%"></div></div>
    </div>

    <!-- Lampu -->
    <div class="metric-card lamp">
      <div class="metric-label"><span class="icon">💡</span> KONTROL LAMPU</div>
      <div class="lamp-status">
        <div class="lamp-icon" id="lampIcon">💡</div>
        <div class="lamp-text" id="lampText">OFF</div>
      </div>
      <div class="lamp-toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="lampToggle" onchange="toggleLamp()">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
        <span style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted)">PUBLISH KE MQTT</span>
      </div>
    </div>
  </div>

  <!-- CHART -->
  <div class="history-section">
    <div class="section-title">📈 GRAFIK RIWAYAT</div>
    <canvas id="chart"></canvas>
  </div>

  <!-- LOG -->
  <div class="log-panel">
    <div class="section-title">📋 LOG AKTIVITAS</div>
    <div class="log-entries" id="logBox"></div>
  </div>

  <div class="last-update" id="lastUpdate">Last update: --</div>
</div>

<script>
// ──────────────────────────────────────────────
// CHART SETUP (tanpa library external)
// ──────────────────────────────────────────────
const MAX_POINTS = 20;
const histTemp = [];
const histHum  = [];
const histLabels = [];

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const PAD = { top: 14, right: 20, bottom: 30, left: 40 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top  - PAD.bottom;

  ctx.clearRect(0, 0, W, H);

  if (histTemp.length < 2) {
    ctx.fillStyle = 'rgba(58,96,128,0.5)';
    ctx.font = "12px 'Share Tech Mono', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('Menunggu data dari ESP32...', W/2, H/2);
    return;
  }

  // Grid
  const gridLines = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= gridLines; i++) {
    const y = PAD.top + (cH / gridLines) * i;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cW, y); ctx.stroke();
  }

  function plotLine(data, color, min, max) {
    if (data.length < 2) return;
    const grd = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + cH);
    grd.addColorStop(0, color + '55');
    grd.addColorStop(1, color + '00');

    const xStep = cW / (MAX_POINTS - 1);

    ctx.beginPath();
    data.forEach((v, i) => {
      const x = PAD.left + (MAX_POINTS - data.length + i) * xStep;
      const y = PAD.top + cH - ((v - min) / (max - min)) * cH;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 8; ctx.shadowColor = color;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Fill
    const lastX = PAD.left + (MAX_POINTS - 1) * xStep;
    const firstX = PAD.left + (MAX_POINTS - data.length) * xStep;
    ctx.lineTo(lastX, PAD.top + cH);
    ctx.lineTo(firstX, PAD.top + cH);
    ctx.closePath();
    ctx.fillStyle = grd;
    ctx.fill();
  }

  plotLine(histTemp, '#ff6b35', 0,  60);
  plotLine(histHum,  '#00d4ff', 0, 100);

  // Axis labels
  ctx.fillStyle = 'rgba(58,96,128,0.9)';
  ctx.font = "10px 'Share Tech Mono', monospace";
  ctx.textAlign = 'right';
  ['0','25','50','75','100'].forEach((v, i) => {
    const y = PAD.top + cH - (i / 4) * cH;
    ctx.fillText(v, PAD.left - 6, y + 4);
  });

  // Legend
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ff6b35';
  ctx.fillRect(PAD.left, 2, 12, 4);
  ctx.fillText('Suhu (°C)', PAD.left + 16, 10);
  ctx.fillStyle = '#00d4ff';
  ctx.fillRect(PAD.left + 90, 2, 12, 4);
  ctx.fillText('Kelembaban (%)', PAD.left + 106, 10);
}

window.addEventListener('resize', drawChart);
drawChart();

// ──────────────────────────────────────────────
// MQTT
// ──────────────────────────────────────────────
let client = null;
let lampState = false;

function log(msg, type = 'info') {
  const box = document.getElementById('logBox');
  const ts  = new Date().toLocaleTimeString('id-ID');
  const el  = document.createElement('div');
  el.className = `log-entry ${type}`;
  el.innerHTML = `<span class="ts">[${ts}]</span><span class="msg">${msg}</span>`;
  box.insertBefore(el, box.firstChild);
  while (box.children.length > 50) box.removeChild(box.lastChild);
}

function setConnState(state) {
  const dot   = document.getElementById('connDot');
  const label = document.getElementById('connLabel');
  dot.className = 'dot';
  if (state === 'connected')   { dot.classList.add('connected');  label.style.color = 'var(--accent3)'; label.textContent = 'CONNECTED'; }
  else if (state === 'connecting') { dot.classList.add('connecting'); label.style.color = 'var(--warm)';   label.textContent = 'CONNECTING...'; }
  else if (state === 'error')  { dot.classList.add('error');      label.style.color = 'var(--danger)';  label.textContent = 'ERROR'; }
  else                          { label.style.color = 'var(--muted)'; label.textContent = 'DISCONNECTED'; }
}

function connectMQTT() {
  const broker   = document.getElementById('broker').value.trim();
  const port     = parseInt(document.getElementById('port').value);
  const clientId = 'dashboard_' + Math.random().toString(36).slice(2, 9);

  if (client && client.isConnected()) {
    log('Sudah terhubung. Putuskan dulu.', 'warn');
    return;
  }

  setConnState('connecting');
  log(`Menghubungkan ke ${broker}:${port}...`);

  try {
    client = new Paho.Client(broker, port, '/mqtt', clientId);

    client.onConnectionLost = (resp) => {
      setConnState('disconnected');
      log(`Koneksi terputus: ${resp.errorMessage}`, 'err');
    };

    client.onMessageArrived = (msg) => {
      const topic   = msg.destinationName;
      const payload = msg.payloadString.trim();
      const now     = new Date().toLocaleTimeString('id-ID');
      document.getElementById('lastUpdate').textContent = `Last update: ${now}`;

      const topicTemp = document.getElementById('topicTemp').value.trim();
      const topicHum  = document.getElementById('topicHum').value.trim();
      const topicLamp = document.getElementById('topicLamp').value.trim();

      if (topic === topicTemp) {
        const val = parseFloat(payload);
        if (!isNaN(val)) {
          document.getElementById('tempVal').textContent = val.toFixed(1);
          const pct = Math.min(Math.max((val / 60) * 100, 0), 100);
          document.getElementById('tempGauge').style.width = pct + '%';
          document.getElementById('tempStatus').textContent =
            val < 20 ? '❄️ Dingin' : val < 30 ? '✅ Normal' : val < 38 ? '⚠️ Hangat' : '🔥 Panas';
          histTemp.push(val);
          if (histTemp.length > MAX_POINTS) histTemp.shift();
          drawChart();
          log(`[${topicTemp}] Suhu: ${val}°C`, 'ok');
        }
      } else if (topic === topicHum) {
        const val = parseFloat(payload);
        if (!isNaN(val)) {
          document.getElementById('humVal').textContent = val.toFixed(1);
          document.getElementById('humGauge').style.width = Math.min(val, 100) + '%';
          document.getElementById('humStatus').textContent =
            val < 30 ? '🏜️ Kering' : val < 60 ? '✅ Normal' : val < 80 ? '💧 Lembab' : '🌊 Sangat Lembab';
          histHum.push(val);
          if (histHum.length > MAX_POINTS) histHum.shift();
          drawChart();
          log(`[${topicHum}] Kelembaban: ${val}%`, 'ok');
        }
      } else if (topic === topicLamp) {
        const isOn = payload === '1' || payload.toLowerCase() === 'on';
        setLampUI(isOn);
        log(`[${topicLamp}] Lampu: ${isOn ? 'ON' : 'OFF'}`, 'info');
      }
    };

    const useSSL = port === 8884 || port === 443;
    client.connect({
      useSSL,
      onSuccess: () => {
        setConnState('connected');
        log(`✅ Terhubung ke ${broker}`, 'ok');

        const topics = [
          document.getElementById('topicTemp').value.trim(),
          document.getElementById('topicHum').value.trim(),
          document.getElementById('topicLamp').value.trim()
        ];
        topics.forEach(t => {
          client.subscribe(t);
          log(`📡 Subscribe: ${t}`, 'info');
        });
      },
      onFailure: (err) => {
        setConnState('error');
        log(`❌ Gagal: ${err.errorMessage}`, 'err');
      }
    });
  } catch (e) {
    setConnState('error');
    log(`❌ Error: ${e.message}`, 'err');
  }
}

function disconnectMQTT() {
  if (client && client.isConnected()) {
    client.disconnect();
    setConnState('disconnected');
    log('Koneksi diputus.', 'warn');
  } else {
    log('Tidak ada koneksi aktif.', 'warn');
  }
}

function setLampUI(on) {
  lampState = on;
  document.getElementById('lampIcon').className = 'lamp-icon' + (on ? ' on' : '');
  document.getElementById('lampText').className = 'lamp-text' + (on ? ' on' : '');
  document.getElementById('lampText').textContent = on ? 'ON' : 'OFF';
  document.getElementById('lampToggle').checked = on;
}

function toggleLamp() {
  if (!client || !client.isConnected()) {
    log('⚠️ Belum terhubung ke MQTT!', 'warn');
    document.getElementById('lampToggle').checked = lampState;
    return;
  }
  const newState = document.getElementById('lampToggle').checked;
  const topic    = document.getElementById('topicLamp').value.trim();
  const payload  = newState ? '1' : '0';

  const msg = new Paho.Message(payload);
  msg.destinationName = topic;
  msg.retained = true;
  client.send(msg);

  setLampUI(newState);
  log(`💡 Publish [${topic}]: ${payload} (Lampu ${newState ? 'ON' : 'OFF'})`, 'ok');
}

// Init log
log('Dashboard siap. Konfigurasi MQTT lalu klik CONNECT.', 'info');
log('Default broker: broker.hivemq.com:8884 (WSS)', 'info');
</script>
